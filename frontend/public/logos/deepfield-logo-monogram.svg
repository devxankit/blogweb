<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <style>
    .df-mono-title { font-family: "Newsreader Display", Georgia, "Times New Roman", serif; font-size: 27px; font-weight: 500; letter-spacing: -0.01em; fill: #0f1a2a; }
    .df-mono-sub { font-family: "Schibsted Grotesk", system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 600; letter-spacing: 0.22em; fill: #5b6676; text-transform: uppercase; }
    @media (prefers-color-scheme: dark) {
      .df-mono-title { fill: #e8ecf2; }
      .df-mono-sub { fill: #9aa7ba; }
    }
  </style>

  <!-- Monogram Mark (48x48) -->
  <g transform="translate(8, 8) scale(0.75)">
    <rect width="64" height="64" rx="14" fill="#0c1a2e"/>
    <ellipse cx="33" cy="33" rx="26" ry="11" stroke="#3566d6" stroke-width="1.8" transform="rotate(-30 33 33)" stroke-dasharray="1 2"/>
    <ellipse cx="33" cy="33" rx="26" ry="11" stroke="#e8ecf2" stroke-width="1.5" stroke-opacity="0.75" transform="rotate(-30 33 33)"/>

    <g fill="#e8ecf2">
      <path d="M16 16 h6 v32 h-6 v-3 h2 v-26 h-2 z"/>
      <path d="M22 16 c9 0 16 6 16 16 s-7 16 -16 16 v-4 c6 0 11.5 -4.5 11.5 -12 s-5.5 -12 -11.5 -12 z"/>
      <path d="M37 20 h13 v3.5 h-11 v9 h9 v3.5 h-9 v12 h-3.5 v-28 z"/>
    </g>

    <circle cx="49" cy="20" r="3" fill="#c88d16"/>
    <circle cx="49" cy="20" r="4.5" stroke="#c88d16" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- Vertical Rule -->
  <line x1="68" y1="16" x2="68" y2="48" stroke="#5b6676" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Brand Typography -->
  <text x="80" y="35" class="df-mono-title">Deep Field</text>
  <text x="81" y="47" class="df-mono-sub">Cosmology &amp; Discovery</text>
</svg>

