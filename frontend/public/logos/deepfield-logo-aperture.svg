<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <style>
    .df-text-title { font-family: "Newsreader Display", Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; fill: #0f1a2a; }
    .df-text-sub { font-family: "Schibsted Grotesk", system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 600; letter-spacing: 0.22em; fill: #5b6676; text-transform: uppercase; }
    .df-stroke-frame { stroke: #0f1a2a; }
    .df-star-core { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .df-text-title { fill: #e8ecf2; }
      .df-text-sub { fill: #9aa7ba; }
      .df-stroke-frame { stroke: #e8ecf2; }
      .df-star-core { fill: #0c1a2e; }
    }
  </style>

  <!-- Mark Container (48x48 at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.75)">
    <!-- Outer Focus Ring -->
    <circle cx="32" cy="32" r="30" class="df-stroke-frame" stroke-width="1.8" stroke-opacity="0.25"/>
    <circle cx="32" cy="32" r="23" class="df-stroke-frame" stroke-width="1.4" stroke-dasharray="2 3" stroke-opacity="0.45"/>
    
    <!-- Curved Blades -->
    <path d="M32 9 C43 9 52 18 52 29 C44 26 38 18 32 9Z" fill="#3566d6" fill-opacity="0.88"/>
    <path d="M55 32 C55 43 46 52 35 52 C38 44 46 38 55 32Z" fill="#12917f" fill-opacity="0.88"/>
    <path d="M32 55 C21 55 12 46 12 35 C20 38 26 46 32 55Z" fill="#7452d1" fill-opacity="0.88"/>
    <path d="M9 32 C9 21 18 12 29 12 C26 20 18 26 9 32Z" fill="#c88d16" fill-opacity="0.88"/>

    <!-- Inner Core Structure -->
    <circle cx="32" cy="32" r="14" class="df-stroke-frame" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="32" cy="32" r="6" fill="#0c1a2e" class="df-stroke-frame" stroke-width="1"/>

    <!-- Central Diffraction Star -->
    <path d="M32 19 Q32 32 19 32 Q32 32 32 45 Q32 32 45 32 Q32 32 32 19 Z" fill="#e8ecf2"/>
    <circle cx="32" cy="32" r="2.2" fill="#c88d16"/>
  </g>

  <!-- Divider Line -->
  <line x1="68" y1="16" x2="68" y2="48" stroke="#5b6676" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Brand Typography -->
  <text x="80" y="35" class="df-text-title">Deep Field</text>
  <text x="81" y="47" class="df-text-sub">Space &amp; Science Journal</text>
</svg>

