<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <style>
    .df-astro-title { font-family: "Newsreader Display", Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; fill: #0f1a2a; }
    .df-astro-sub { font-family: "Schibsted Grotesk", system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 600; letter-spacing: 0.22em; fill: #5b6676; text-transform: uppercase; }
    .df-astro-reticle { stroke: #0f1a2a; }
    @media (prefers-color-scheme: dark) {
      .df-astro-title { fill: #e8ecf2; }
      .df-astro-sub { fill: #9aa7ba; }
      .df-astro-reticle { stroke: #e8ecf2; }
    }
  </style>

  <!-- Astrolabe Mark (48x48) -->
  <g transform="translate(8, 8) scale(0.75)">
    <circle cx="32" cy="32" r="30" class="df-astro-reticle" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="32" cy="32" r="27" class="df-astro-reticle" stroke-width="0.8" stroke-opacity="0.2"/>
    <circle cx="32" cy="32" r="21" class="df-astro-reticle" stroke-width="1.2" stroke-dasharray="1 3" stroke-opacity="0.4"/>

    <!-- Reticle Crosshairs -->
    <line x1="32" y1="2" x2="32" y2="10" class="df-astro-reticle" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="32" y1="54" x2="32" y2="62" class="df-astro-reticle" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="2" y1="32" x2="10" y2="32" class="df-astro-reticle" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="54" y1="32" x2="62" y2="32" class="df-astro-reticle" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Distant Spiral Galaxy -->
    <ellipse cx="25" cy="27" rx="8" ry="3.5" transform="rotate(-35 25 27)" fill="#12917f" fill-opacity="0.85"/>
    <circle cx="25" cy="27" r="1.5" fill="#e8ecf2"/>

    <!-- Lensed Galaxy Arc -->
    <path d="M38 21 C43 25 44 32 40 38" stroke="#c88d16" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Central Star -->
    <circle cx="34" cy="36" r="3" fill="#3566d6"/>
    <circle cx="34" cy="36" r="1" fill="#ffffff"/>

    <!-- Faint distant galaxies -->
    <circle cx="21" cy="42" r="1.5" fill="#7452d1"/>
    <circle cx="45" cy="27" r="1.2" fill="#cf4232"/>
  </g>

  <!-- Divider Line -->
  <line x1="68" y1="16" x2="68" y2="48" stroke="#5b6676" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Typography -->
  <text x="80" y="35" class="df-astro-title">Deep Field</text>
  <text x="81" y="47" class="df-astro-sub">Astrophysics &amp; Exploration</text>
</svg>

