<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64" fill="none">
  <style>
    .df-spec-title { font-family: "Newsreader Display", Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; fill: #0f1a2a; }
    .df-spec-sub { font-family: "Schibsted Grotesk", system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 600; letter-spacing: 0.22em; fill: #5b6676; text-transform: uppercase; }
    @media (prefers-color-scheme: dark) {
      .df-spec-title { fill: #e8ecf2; }
      .df-spec-sub { fill: #9aa7ba; }
    }
  </style>

  <!-- Mark (48x48) -->
  <g transform="translate(8, 8) scale(0.75)">
    <circle cx="32" cy="32" r="30" fill="#0c1a2e"/>
    <circle cx="32" cy="27" r="13" fill="#e8ecf2" opacity="0.95"/>
    <circle cx="32" cy="27" r="10" fill="#0c1a2e"/>
    <ellipse cx="32" cy="27" rx="22" ry="7" stroke="#e8ecf2" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-18 32 27)"/>
    
    <g transform="translate(0, 5)">
      <rect x="15" y="38" width="4" height="12" rx="2" fill="#12917f"/>
      <rect x="21" y="35" width="4" height="15" rx="2" fill="#c88d16"/>
      <rect x="27" y="33" width="4" height="17" rx="2" fill="#cf4232"/>
      <rect x="33" y="33" width="4" height="17" rx="2" fill="#3566d6"/>
      <rect x="39" y="35" width="4" height="15" rx="2" fill="#4d9132"/>
      <rect x="45" y="38" width="4" height="12" rx="2" fill="#7452d1"/>
    </g>

    <circle cx="16" cy="18" r="1" fill="#e8ecf2" opacity="0.8"/>
    <circle cx="48" cy="16" r="1.3" fill="#e8b24a"/>
    <circle cx="50" cy="26" r="0.9" fill="#e8ecf2" opacity="0.6"/>
  </g>

  <!-- Spectrum Indicator Bar -->
  <g transform="translate(68, 22)">
    <circle cx="0" cy="3" r="2" fill="#12917f"/>
    <circle cx="0" cy="9" r="2" fill="#c88d16"/>
    <circle cx="0" cy="15" r="2" fill="#cf4232"/>
    <circle cx="0" cy="21" r="2" fill="#3566d6"/>
  </g>

  <!-- Typography -->
  <text x="78" y="35" class="df-spec-title">Deep Field</text>
  <text x="79" y="47" class="df-spec-sub">Long-form Space &amp; Science</text>
</svg>

