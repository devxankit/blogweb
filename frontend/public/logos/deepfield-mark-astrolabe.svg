<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Astrolabe Outer Dial -->
  <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.3"/>
  <circle cx="32" cy="32" r="27" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="32" cy="32" r="21" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1 3" stroke-opacity="0.4"/>

  <!-- Reticle Cardinal Crosshairs -->
  <line x1="32" y1="2" x2="32" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="62" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="32" x2="10" y2="32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="62" y2="32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle 45° Tick marks -->
  <line x1="12" y1="12" x2="15" y2="15" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="52" y1="12" x2="49" y2="15" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="12" y1="52" x2="15" y2="49" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="52" y1="52" x2="49" y2="49" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Deep Sky Galaxies inside the reticle -->
  <!-- Distant Spiral Galaxy (Teal/Emerald) -->
  <ellipse cx="25" cy="27" rx="8" ry="3.5" transform="rotate(-35 25 27)" fill="#12917f" fill-opacity="0.85"/>
  <circle cx="25" cy="27" r="1.5" fill="#e8ecf2"/>

  <!-- Lensed Galaxy Arc (Amber Gold) -->
  <path d="M38 21 C43 25 44 32 40 38" stroke="#c88d16" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Central Pinpoint Star / JWST Hex Star Core (Cosmic Blue) -->
  <circle cx="34" cy="36" r="3" fill="#3566d6"/>
  <circle cx="34" cy="36" r="1" fill="#ffffff"/>

  <!-- Distant faint galaxies -->
  <circle cx="21" cy="42" r="1.5" fill="#7452d1"/>
  <circle cx="45" cy="27" r="1.2" fill="#cf4232"/>
</svg>

